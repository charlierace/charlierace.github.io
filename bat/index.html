<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bring a Trailer - Dynamic Auctions Dashboard</title>
    <style>
        :root {
            --bat-red: #d32f2f;
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --text-light: #e0e0e0;
            --gold: #fbc02d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
        }

        .header {
            max-width: 1100px;
            margin: 0 auto 24px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            padding-bottom: 16px;
        }

        h1 {
            font-size: 1.4rem;
            margin: 0;
            color: #fff;
        }

        .badge {
            background-color: var(--bat-red);
            color: white;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .controls {
            max-width: 1100px;
            margin: 0 auto 24px auto;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 160px;
        }

        label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #888;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        button, input {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        button { 
            cursor: pointer; 
            align-self: flex-end;
            height: 40px;
            background: #333;
        }
        
        button:hover { background: #444; }

        .grid {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid #333;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--gold);
        }

        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            margin: 0 0 10px 0;
            line-height: 1.3;
        }

        .meta-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .tag-title {
            display: inline-block;
            background: rgba(251, 192, 45, 0.15);
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .tag-days {
            display: inline-block;
            background: rgba(46, 125, 50, 0.2);
            color: #81c784;
            border: 1px solid #2e7d32;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .snippet {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 16px;
            background: #181818;
            padding: 8px;
            border-left: 3px solid #555;
            border-radius: 2px;
            line-height: 1.4;
        }

        .btn-link {
            margin-top: auto;
            background-color: var(--bat-red);
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .status-msg {
            max-width: 1100px;
            margin: 40px auto;
            text-align: center;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🚗 BaT Active Auctions</h1>
        <span class="badge" id="count-badge">0 Open Listings</span>
    </div>

    <div class="controls">
        <div class="input-group" style="max-width: 160px;">
            <label for="days-input">Closing in ≤ Days</label>
            <input type="number" id="days-input" value="2" min="1" max="14" oninput="filterGrid()">
        </div>
        <div class="input-group">
            <label for="title-input">Place of Title Filter (Optional)</label>
            <input type="text" id="title-input" placeholder="e.g. California, CA, Texas..." oninput="filterGrid()">
        </div>
        <div class="input-group">
            <label for="model-input">Filter Make/Model</label>
            <input type="text" id="model-input" placeholder="e.g. Porsche, BMW, Ford..." oninput="filterGrid()">
        </div>
        <button onclick="fetchListings()">🔄 Refresh Feed</button>
    </div>

    <div id="status" class="status-msg">Fetching live BaT listings...</div>

    <div class="grid" id="car-grid"></div>

    <script>
        const RSS_TARGET = 'https://bringatrailer.com/feed/';
        
        const PROXIES = [
            `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_TARGET)}`,
            `https://api.allorigins.win/get?url=${encodeURIComponent(RSS_TARGET)}`,
            `https://corsproxy.io/?${encodeURIComponent(RSS_TARGET)}`
        ];

        let allListings = [];

        async function fetchListings() {
            const grid = document.getElementById('car-grid');
            const status = document.getElementById('status');
            status.innerText = "Connecting to live Bring a Trailer feed...";
            grid.innerHTML = "";

            let success = false;

            for (const proxyUrl of PROXIES) {
                try {
                    const response = await fetch(proxyUrl, { signal: AbortSignal.timeout(5000) });
                    if (!response.ok) continue;

                    if (proxyUrl.includes('rss2json')) {
                        const data = await response.json();
                        if (data.status === 'ok' && data.items) {
                            allListings = parseJsonListings(data.items);
                            success = true;
                            break;
                        }
                    } else if (proxyUrl.includes('allorigins')) {
                        const data = await response.json();
                        if (data.contents) {
                            allListings = parseXmlText(data.contents);
                            success = true;
                            break;
                        }
                    } else {
                        const text = await response.text();
                        if (text && text.includes('<rss')) {
                            allListings = parseXmlText(text);
                            success = true;
                            break;
                        }
                    }
                } catch (e) {
                    console.warn(`Proxy ${proxyUrl} failed, trying next...`, e);
                }
            }

            if (success) {
                filterGrid();
            } else {
                status.innerText = "Unable to reach BaT feed at the moment. Please try pressing Refresh.";
            }
        }

        function calculateDaysRemaining(pubDateStr) {
            // Standard BaT auction duration is 7 days from publish date
            const pubDate = new Date(pubDateStr);
            if (isNaN(pubDate)) return 2; // Default fallback if date parsing fails

            const endDate = new Date(pubDate.getTime() + (7 * 24 * 60 * 60 * 1000));
            const now = new Date();
            
            const diffMs = endDate - now;
            const diffDays = diffMs / (1000 * 60 * 60 * 24);

            return diffDays;
        }

        function parseJsonListings(items) {
            return items.map(item => {
                const title = item.title || "";
                const content = item.content || item.description || "";
                const cleanContent = content.replace(/<[^>]*>?/gm, '');
                const daysLeft = calculateDaysRemaining(item.pubDate);

                return {
                    title: title,
                    link: item.link,
                    fullText: `${title} ${cleanContent}`,
                    snippet: cleanContent.substring(0, 150) + "...",
                    daysRemaining: daysLeft
                };
            });
        }

        function parseXmlText(xmlString) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlString, "text/xml");
            const items = xmlDoc.querySelectorAll("item");
            const parsed = [];

            items.forEach(item => {
                const title = item.querySelector("title")?.textContent || "";
                const link = item.querySelector("link")?.textContent || "";
                const description = item.querySelector("description")?.textContent || "";
                const pubDate = item.querySelector("pubDate")?.textContent || "";
                
                const cleanContent = description.replace(/<[^>]*>?/gm, '');
                const daysLeft = calculateDaysRemaining(pubDate);

                parsed.push({
                    title: title,
                    link: link,
                    fullText: `${title} ${cleanContent}`,
                    snippet: cleanContent.substring(0, 150) + "...",
                    daysRemaining: daysLeft
                });
            });

            return parsed;
        }

        function filterGrid() {
            const maxDays = parseFloat(document.getElementById('days-input').value) || 7;
            const titleQuery = document.getElementById('title-input').value.trim().toLowerCase();
            const modelQuery = document.getElementById('model-input').value.trim().toLowerCase();

            const filtered = allListings.filter(car => {
                // Must be still OPEN (daysRemaining > 0) AND closing within X days
                const isOpen = car.daysRemaining > 0;
                const matchesDays = car.daysRemaining <= maxDays;

                const text = car.fullText.toLowerCase();
                const matchesTitle = titleQuery === "" || text.includes(titleQuery);
                const matchesModel = modelQuery === "" || car.title.toLowerCase().includes(modelQuery);

                return isOpen && matchesDays && matchesTitle && matchesModel;
            });

            renderGrid(filtered, titleQuery);
        }

        function renderGrid(listings, titleQuery) {
            const grid = document.getElementById('car-grid');
            const status = document.getElementById('status');
            const badge = document.getElementById('count-badge');

            badge.innerText = `${listings.length} Open Listings`;

            if (listings.length === 0) {
                status.innerText = "No active listings match your current criteria.";
                return;
            }

            status.innerText = "";
            grid.innerHTML = listings.map(car => {
                const formattedDays = car.daysRemaining < 1 
                    ? `${Math.round(car.daysRemaining * 24)} Hours Left` 
                    : `${car.daysRemaining.toFixed(1)} Days Left`;

                return `
                    <a href="${car.link}" target="_blank" class="card">
                        <div class="card-body">
                            <div class="meta-row">
                                <span class="tag-days">⏱️ ${formattedDays}</span>
                                ${titleQuery !== "" ? `<span class="tag-title">Matched Title: "${titleQuery}"</span>` : ''}
                            </div>
                            <div class="title">${car.title}</div>
                            <div class="snippet">${car.snippet}</div>
                            <div class="btn-link">View Listing on BaT ↗</div>
                        </div>
                    </a>
                `;
            }).join('');
        }

        fetchListings();
    </script>
</body>
</html>

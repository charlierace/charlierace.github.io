<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form Line — tomorrow's racecards, scored</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Azeret+Mono:wght@400;600&family=Chivo:wght@400;600;900&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ---------- */
:root{
  --turf:        #12241A;   /* deep paddock green, page ground */
  --turf-raised: #1B3325;   /* cards, rail */
  --turf-lift:   #24422F;   /* hover, selected */
  --rail:        #E9E4D4;   /* running-rail white — hairlines & primary text */
  --chalk:       #EFEBDC;   /* bookmaker's chalk */
  --muted:       #8FA795;
  --gold:        #E0A93C;   /* the 1 cloth */
  --silver:      #B9C3BC;
  --bronze:      #B57A4A;
  --claret:      #A6394A;
  --ink:         #0B1711;

  --f-display: 'Alfa Slab One', Georgia, serif;
  --f-body:    'Chivo', system-ui, -apple-system, sans-serif;
  --f-data:    'Azeret Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  --gap: 18px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--turf);
  color:var(--chalk);
  font-family:var(--f-body);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- masthead ---------- */
.masthead{
  border-bottom:1px solid rgba(233,228,212,.22);
  padding:20px var(--gap) 14px;
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 24px;
}
.wordmark{
  font-family:var(--f-display);
  font-size:clamp(30px,5.5vw,44px);
  line-height:.9;
  letter-spacing:-.01em;
  margin:0;
}
.wordmark em{font-style:normal;color:var(--gold)}
.masthead-note{
  font-family:var(--f-data);
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);
  margin:0 0 4px;
  flex:1 1 200px;
}
.masthead-actions{display:flex;gap:8px;margin-bottom:2px}
.ghost-btn{
  font-family:var(--f-data);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  border:1px solid rgba(233,228,212,.3);
  padding:7px 11px;border-radius:2px;color:var(--muted);
}
.ghost-btn:hover{color:var(--chalk);border-color:var(--chalk)}
.ghost-btn[aria-expanded="true"]{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}

/* ---------- settings drawer ---------- */
.settings{
  display:none;
  border-bottom:1px solid rgba(233,228,212,.22);
  background:var(--turf-raised);
  padding:16px var(--gap);
  gap:26px;flex-wrap:wrap;
}
.settings.is-open{display:flex}
.field{display:flex;flex-direction:column;gap:6px}
.field-label{
  font-family:var(--f-data);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
}
.field select,.field input[type="date"]{
  font-family:var(--f-data);font-size:13px;
  background:var(--turf);color:var(--chalk);
  border:1px solid rgba(233,228,212,.3);border-radius:2px;padding:7px 9px;
}
.field-hint{font-size:12px;color:var(--muted);max-width:34ch}

/* ---------- layout ---------- */
.layout{
  display:grid;
  grid-template-columns:minmax(230px,290px) 1fr;
  align-items:start;
  min-height:calc(100vh - 90px);
}
.rail{
  border-right:1px solid rgba(233,228,212,.22);
  padding:var(--gap) 0 60px;
  position:sticky;top:0;max-height:100vh;overflow-y:auto;
}
.card-area{padding:var(--gap) var(--gap) 80px}

/* ---------- meetings rail ---------- */
.rail-head{
  font-family:var(--f-data);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);padding:0 var(--gap) 10px;
}
.meeting{margin-bottom:16px}
.meeting-name{
  display:flex;align-items:baseline;gap:8px;
  padding:0 var(--gap) 6px;
  font-weight:900;font-size:16px;letter-spacing:-.01em;
}
.meeting-going{
  font-family:var(--f-data);font-size:10px;letter-spacing:.06em;
  color:var(--muted);text-transform:uppercase;font-weight:400;
}
.race-btn{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:7px var(--gap);text-align:left;
  border-left:3px solid transparent;
}
.race-btn:hover{background:var(--turf-raised)}
.race-btn.is-on{background:var(--turf-lift);border-left-color:var(--gold)}
.race-time{font-family:var(--f-data);font-size:13px;font-weight:600;min-width:44px}
.race-blurb{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.race-btn.is-on .race-blurb{color:var(--chalk)}

/* ---------- race header ---------- */
.race-head{border-bottom:1px solid rgba(233,228,212,.22);padding-bottom:16px;margin-bottom:6px}
.race-title{
  font-family:var(--f-display);
  font-size:clamp(21px,3.2vw,30px);line-height:1.08;margin:0 0 8px;
}
.race-meta{
  display:flex;flex-wrap:wrap;gap:6px 8px;
  font-family:var(--f-data);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
}
.tag{border:1px solid rgba(233,228,212,.3);padding:3px 8px;border-radius:2px;color:var(--muted)}
.tag.tag-key{border-color:var(--gold);color:var(--gold)}

/* ---------- runner rows ---------- */
.runners{list-style:none;margin:0;padding:0}
.runner{
  display:grid;
  grid-template-columns:34px 42px 1fr auto;
  gap:14px;align-items:center;
  padding:16px 4px;
  border-bottom:1px solid rgba(233,228,212,.13);
}
.runner.is-top{background:linear-gradient(90deg,rgba(224,169,60,.11),transparent 62%)}
.rank{
  font-family:var(--f-display);font-size:22px;line-height:1;
  color:var(--muted);text-align:right;
}
.runner.is-top .rank{color:var(--gold)}
.rank small{font-family:var(--f-data);font-size:10px;display:block;color:var(--muted);font-weight:400;margin-top:3px}
.silks{width:42px;height:46px;display:block}
.runner-main{min-width:0}
.horse{
  font-weight:900;font-size:17px;letter-spacing:-.01em;
  display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
}
.cloth{
  font-family:var(--f-data);font-size:10px;font-weight:600;
  background:var(--chalk);color:var(--ink);
  padding:2px 5px;border-radius:2px;letter-spacing:0;
}
.people{font-size:12.5px;color:var(--muted);margin:2px 0 8px}

/* the form ladder — signature element */
.ladder{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.ladder-label{
  font-family:var(--f-data);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin-right:4px;
}
.rung{
  width:26px;height:26px;border-radius:2px;
  display:grid;place-items:center;
  font-family:var(--f-data);font-size:11px;font-weight:600;
  background:rgba(233,228,212,.08);color:var(--muted);
  border:1px solid transparent;
  position:relative;
}
.rung[data-pos="1"]{background:var(--gold);color:var(--ink)}
.rung[data-pos="2"]{background:var(--silver);color:var(--ink)}
.rung[data-pos="3"]{background:var(--bronze);color:var(--ink)}
.rung[data-pos="4"]{background:rgba(233,228,212,.42);color:var(--ink)}
.rung[data-pos="5"]{background:rgba(233,228,212,.24);color:var(--chalk)}
.rung.is-cd{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.rung-sep{width:1px;height:18px;background:rgba(233,228,212,.25);margin:0 5px}
.chip{
  font-family:var(--f-data);font-size:10px;font-weight:600;letter-spacing:.06em;
  padding:5px 7px;border-radius:2px;
  border:1px solid var(--gold);color:var(--gold);
}
.chip.is-off{border-color:rgba(233,228,212,.16);color:rgba(143,167,149,.55)}

/* score block */
.score{text-align:right;min-width:74px}
.score-num{font-family:var(--f-display);font-size:34px;line-height:.9}
.runner.is-top .score-num{color:var(--gold)}
.score-word{font-family:var(--f-data);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.score-bar{height:4px;background:rgba(233,228,212,.12);margin-top:7px;border-radius:2px;overflow:hidden}
.score-bar i{display:block;height:100%;background:var(--gold);border-radius:2px;transition:width .5s cubic-bezier(.2,.8,.2,1)}

/* ---------- misc ---------- */
.empty{padding:70px 10px;max-width:44ch}
.empty h2{font-family:var(--f-display);font-size:24px;margin:0 0 10px}
.empty p{color:var(--muted);margin:0 0 8px}
.footnote{
  margin-top:34px;padding-top:16px;
  border-top:1px solid rgba(233,228,212,.16);
  font-size:12.5px;color:var(--muted);max-width:64ch;
}
.footnote code{font-family:var(--f-data);font-size:11.5px;color:var(--chalk)}
.banner{
  background:var(--claret);color:#fff;padding:10px var(--gap);
  font-family:var(--f-data);font-size:11.5px;letter-spacing:.04em;
}

@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .rail{position:static;max-height:none;border-right:none;border-bottom:1px solid rgba(233,228,212,.22)}
  .runner{grid-template-columns:26px 34px 1fr;gap:10px;row-gap:10px}
  .silks{width:34px;height:38px}
  .score{grid-column:1 / -1;text-align:left;display:flex;align-items:baseline;gap:9px}
  .score-bar{display:none}
  .score-num{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>

<header class="masthead">
  <h1 class="wordmark">Form<em>·</em>Line</h1>
  <p class="masthead-note" id="dateNote">Loading cards…</p>
  <div class="masthead-actions">
    <button class="ghost-btn" id="settingsBtn" aria-expanded="false" aria-controls="settings">Scoring</button>

  <div class="field">

      <option value="0.5">Within ½ furlong</option>
      <option value="1">Within 1 furlong</option>
    </select>
  </div>
  <div class="field">
    <label class="field-label" for="optCD">Unprovable course &amp; distance win</label>
    <select id="optCD">
      <option value="withhold" selected>Withhold the point</option>
      <option value="award">Award it</option>
    </select>
    <span class="field-hint">When a horse has won here and won over the trip, but not within its visible starts.</span>
  </div>
  <div class="field">
    <label class="field-label" for="optSource">Data</label>
    <select id="optSource">
      <option value="embedded">Card built into this file</option>
      <option value="sample">Sample cards</option>
      <option value="remote">./data/racecards-DATE.json</option>
    </select>
    <span class="field-hint">Point this at a file your scraper commits.</span>
  </div>
</section>

<div class="layout">
  <nav class="rail" id="rail" aria-label="Meetings and races"></nav>
  <main class="card-area" id="cardArea"></main>
</div>

<script>
/* ============================================================
   1. SCORING  — the whole model lives in this one function.
   ============================================================ */

const POS_POINTS = {1:5, 2:4, 3:3, 4:2, 5:1};   // 6th and worse, and all
                                                 // non-completions, score 0.
const BONUS = { course:2, distance:2, courseAndDistance:1 };

const DEFAULTS = { runs:5, scope:'career', tol:0, unknownCD:'withhold' };

function distMatches(a, b, tol){ return Math.abs(a - b) <= tol + 1e-9; }

/**
 * runner.form      — runs, most recent first: {pos, course, dist, date}
 *                    pos is a number, or 'PU'/'F'/'UR'/'BD'/'RO' etc.
 * runner.careerWins— every career win: {course, dist, date}
 * race             — {course, dist}
 */
function scoreRunner(runner, race, opts = DEFAULTS){
  const window = runner.form.slice(0, opts.runs);

  // --- form points ---
  let formPoints = 0;
  const rungs = window.map(run => {
    const pts = (typeof run.pos === 'number' && POS_POINTS[run.pos]) || 0;
    formPoints += pts;
    return {
      pos: run.pos,
      pts,
      course: run.course,
      courseName: run.courseName,
      dist: run.dist,
      date: run.date,
      cd: run.pos === 1 && run.course === race.course
          && distMatches(run.dist, race.dist, opts.tol)
          && (!run.surface || !race.surfaceCode || run.surface === race.surfaceCode)
    };
  });

  // --- course / distance bonuses ---
  // A feed may hand us career totals rather than a list of wins (BRIS does:
  // its lifetime course and distance records are surface-restricted already).
  // Prefer those when present, since a win list is usually capped at 10 starts.
  const flags = runner.careerFlags;
  const useFlags = flags && opts.scope === 'career';

  const winPool = opts.scope === 'career'
    ? (runner.careerWins || window.filter(r => r.pos === 1))
    : window.filter(r => r.pos === 1);

  const wonCourse = useFlags ? !!flags.course
    : winPool.some(w => w.course === race.course);
  const wonDist   = useFlags ? !!flags.distance
    : winPool.some(w => distMatches(w.dist, race.dist, opts.tol));

  // cd may be null: both lifetime flags are set, but the visible starts don't
  // prove one single win did both. opts.unknownCD decides what that's worth.
  let wonCD, cdUnknown = false;
  if (useFlags && flags.cd === null){
    cdUnknown = true;
    wonCD = opts.unknownCD === 'award';
  } else {
    wonCD = useFlags ? !!flags.cd
      : winPool.some(w => w.course === race.course && distMatches(w.dist, race.dist, opts.tol));
  }

  const bonus =
      (wonCourse ? BONUS.course : 0)
    + (wonDist   ? BONUS.distance : 0)
    + (wonCD     ? BONUS.courseAndDistance : 0);

  // --- tie-breaks: freshest win first, then lowest saddlecloth ---
  const lastWin = winPool.length
    ? winPool.map(w => w.date).sort().slice(-1)[0]
    : '';

  return {
    total: formPoints + bonus,
    formPoints, bonus, rungs,
    wonCourse, wonDist, wonCD, cdUnknown, lastWin,
    runsCounted: window.length
  };
}

function maxPossible(opts){
  return opts.runs * 5 + BONUS.course + BONUS.distance + BONUS.courseAndDistance;
}

function rankRunners(race, opts){
  const scored = race.runners
    .filter(r => !r.nonRunner)
    .map(r => ({ ...r, score: scoreRunner(r, race, opts) }));

  scored.sort((a,b) =>
       b.score.total      - a.score.total
    || b.score.formPoints - a.score.formPoints
    || (a.score.lastWin < b.score.lastWin ? 1 : a.score.lastWin > b.score.lastWin ? -1 : 0)
    || a.cloth - b.cloth
  );

  // joint ranks for genuine ties
  let rank = 0, prev = null;
  scored.forEach((r, i) => {
    if (prev === null || r.score.total !== prev) { rank = i + 1; prev = r.score.total; }
    r.rank = rank;
    r.joint = false;
  });
  scored.forEach(r => {
    r.joint = scored.filter(o => o.rank === r.rank).length > 1;
  });
  return scored;
}

/* ============================================================
   2. DATA  — swap the adapter, keep everything else.
   ============================================================ */

function embedded(){
  const tag = document.getElementById('embeddedCard');
  if (!tag) return null;
  try { return JSON.parse(tag.textContent); } catch { return null; }
}

const DataSource = {
  mode: embedded() ? 'embedded' : 'sample',
  async cardsFor(dateISO){
    if (this.mode === 'embedded'){
      const e = embedded();
      if (!e) throw new Error('No card is embedded in this file.');
      if (e.date !== dateISO)
        throw new Error(`This file only holds the card for ${e.date}.`);
      return e.meetings;
    }
    if (this.mode === 'remote'){
      const res = await fetch(`./data/racecards-${dateISO}.json`);
      if (!res.ok) throw new Error(`No card file for ${dateISO} (HTTP ${res.status})`);
      return res.json();
    }
    return sampleCards(dateISO);
  }
};

/* --- deterministic sample generator, so a given date always
       produces the same card and you can eyeball the maths --- */
function mulberry(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const hashStr = s => { let h = 2166136261; for (const c of s){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619);} return h >>> 0; };

const COURSES = [
  {name:'Newmarket', going:'Good to firm', dists:[5,6,7,8,10,12]},
  {name:'Ascot',     going:'Good',         dists:[6,7,8,10,12,14]},
  {name:'Haydock',   going:'Soft',         dists:[5,6,8,10,12,16]},
  {name:'Chepstow',  going:'Good to soft', dists:[6,8,10,13,16,20]},
];
const ALL_COURSES = [...COURSES.map(c=>c.name), 'York','Goodwood','Doncaster','Sandown','Newbury','Leicester','Thirsk','Ripon'];
const W1 = ['Kodiac','Desert','Midnight','Harbour','Saffron','Copper','Winter','Gallant','Tacitus','Bold','Silent','Northern','Lambourn','Ivory','Rebel','Crimson','Quiet','Marble','Thunder','Petra','Golden','Sable','Rowan','Hazel'];
const W2 = ['Crown','Rumour','Lantern','Quest','Belle','Mistral','Compass','Verdict','Anthem','Falcon','Reef','Tempo','Archer','Larkspur','Whisper','Cavalier','Sonnet','Harrier','Prospect','Vigil','Duchess','Bandit','Meridian','Ledger'];
const JOCKEYS = ['R Havlin','H Doyle','T Marquand','O Murphy','W Buick','R Kingscote','J Fanning','K Shoemark','C Bishop','D Muscutt','S De Sousa','B Curtis'];
const TRAINERS = ['J Gosden','A Balding','C Appleby','R Varian','W Haggas','K Burke','M Johnston','R Beckett','D O\'Meara','E Walker'];
const NF = ['PU','F','UR','BD','RO'];
const GRADES = ['Novice Stakes','Handicap','Maiden Stakes','Class 3 Handicap','Nursery Handicap','Conditions Stakes','Class 2 Handicap','Fillies\' Handicap'];

function sampleCards(dateISO){
  const rnd = mulberry(hashStr(dateISO));
  const pick = a => a[Math.floor(rnd()*a.length)];
  const daysBefore = n => {
    const d = new Date(dateISO + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate()-n);
    return d.toISOString().slice(0,10);
  };

  return COURSES.map(course => {
    const nRaces = 4 + Math.floor(rnd()*2);
    const races = [];
    for (let i = 0; i < nRaces; i++){
      const dist = pick(course.dists);
      const hh = 13 + Math.floor((i*35 + 10)/60);
      const mm = (i*35 + 10) % 60;
      const race = {
        id: `${course.name}-${dateISO}-${i}`.replace(/\s+/g,''),
        course: course.name,
        going: course.going,
        dist,
        time: `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`,
        name: `${pick(GRADES)}`,
        runners: []
      };
      const n = 6 + Math.floor(rnd()*6);
      for (let c = 1; c <= n; c++){
        const name = `${pick(W1)} ${pick(W2)}`;
        const ability = rnd();              // hidden quality, shapes the form
        const form = [], careerWins = [];
        let ago = 12 + Math.floor(rnd()*20);
        for (let r = 0; r < 10; r++){
          const roll = rnd() * (0.45 + ability);
          let pos;
          if (roll > 0.92) pos = pick(NF);
          else pos = Math.max(1, Math.min(14, Math.ceil((1 - roll) * 13) || 1));
          // let some horses have real course/distance affinity
          const atThisCourse = rnd() < (0.28 + ability*0.2);
          const runCourse = atThisCourse ? course.name : pick(ALL_COURSES);
          const runDist = rnd() < (0.3 + ability*0.25) ? dist : pick(course.dists);
          const date = daysBefore(ago);
          form.push({pos, course:runCourse, dist:runDist, date});
          if (pos === 1) careerWins.push({course:runCourse, dist:runDist, date});
          ago += 14 + Math.floor(rnd()*45);
        }
        race.runners.push({
          cloth: c,
          name,
          jockey: pick(JOCKEYS),
          trainer: pick(TRAINERS),
          age: 3 + Math.floor(rnd()*5),
          silks: silksSpec(name),
          form, careerWins
        });
      }
      races.push(race);
    }
    return {course: course.name, going: course.going, races};
  });
}

/* ============================================================
   3. SILKS  — every runner gets a jacket, derived from its name
   ============================================================ */
const SILK_COLOURS = ['#D8403A','#1E56A0','#E0A93C','#2E7D4F','#7B3F9D','#E86A2B','#0E9CA8','#C9245E','#F2EDE0','#2B2B2B','#8FBF3F','#E2A0B8'];
const SILK_PATTERNS = ['solid','stripes','hoops','sash','chevron','spots','halved','star'];

/* BRIS ships the registered owner's colours as prose, e.g.
   "Red; 'JG' inside white diamonds on back; white diamonds on sleeves; red cap".
   Read what we can from it and fall back to the generated jacket. */
const COLOUR_WORDS = {
  red:'#D8403A', dark:'#2B2B2B', black:'#1A1A1A', white:'#F4F1E8', blue:'#1E56A0',
  royal:'#1E56A0', navy:'#16305C', light:'#7FB2E5', green:'#2E7D4F', lime:'#8FBF3F',
  yellow:'#EFC53F', gold:'#D9A441', orange:'#E86A2B', purple:'#7B3F9D', pink:'#E2A0B8',
  grey:'#9AA0A0', gray:'#9AA0A0', brown:'#7A4B2A', maroon:'#7A2231', turquoise:'#0E9CA8',
  silver:'#C8CCC9', tan:'#C8A97E', beige:'#DED3B6', cerise:'#C9245E', lavender:'#B9A5D8'
};
const PATTERN_WORDS = [
  ['stripe','stripes'], ['hoop','hoops'], ['sash','sash'], ['chevron','chevron'],
  ['diamond','spots'], ['spot','spots'], ['star','star'], ['halve','halved'],
  ['quarter','halved'], ['ball','spots'], ['dot','spots']
];

function colourAt(text, i){
  const w = text.slice(Math.max(0,i-40), i).toLowerCase().match(/[a-z]+/g) || [];
  for (let k = w.length-1; k >= 0; k--) if (COLOUR_WORDS[w[k]]) return COLOUR_WORDS[w[k]];
  return null;
}

function silksFromText(text, fallbackSeed){
  const spec = silksSpec(fallbackSeed);
  if (!text) return spec;
  const t = text.toLowerCase();

  const first = (t.match(/[a-z]+/g) || []).find(w => COLOUR_WORDS[w]);
  if (first) spec.base = COLOUR_WORDS[first];

  const cap = t.indexOf('cap');
  if (cap > -1) spec.cap = colourAt(t, cap) || spec.cap;

  const sl = t.indexOf('sleeve');
  if (sl > -1) spec.sleeves = colourAt(t, sl) || spec.sleeves;

  const others = (t.match(/[a-z]+/g) || []).filter(w => COLOUR_WORDS[w] && COLOUR_WORDS[w] !== spec.base);
  if (others.length) spec.second = COLOUR_WORDS[others[0]];

  for (const [needle, pat] of PATTERN_WORDS)
    if (t.includes(needle)) { spec.pattern = pat; break; }

  return spec;
}

function silksSpec(seedStr){
  const rnd = mulberry(hashStr(seedStr));
  const pick = a => a[Math.floor(rnd()*a.length)];
  let base = pick(SILK_COLOURS), second = pick(SILK_COLOURS);
  if (second === base) second = SILK_COLOURS[(SILK_COLOURS.indexOf(base)+5) % SILK_COLOURS.length];
  return {base, second, cap:pick(SILK_COLOURS), sleeves:pick(SILK_COLOURS), pattern:pick(SILK_PATTERNS)};
}

function silksSVG(s, id){
  const cid = `clip${id}`;
  let motif = '';
  if (s.pattern === 'stripes')
    motif = [0,1,2,3].map(i=>`<rect x="${10+i*5}" y="12" width="2.6" height="26" fill="${s.second}"/>`).join('');
  else if (s.pattern === 'hoops')
    motif = [0,1,2].map(i=>`<rect x="8" y="${15+i*8}" width="24" height="4" fill="${s.second}"/>`).join('');
  else if (s.pattern === 'sash')
    motif = `<path d="M8 34 L32 12 L32 19 L8 41 Z" fill="${s.second}"/>`;
  else if (s.pattern === 'chevron')
    motif = `<path d="M8 30 L20 18 L32 30 L32 36 L20 24 L8 36 Z" fill="${s.second}"/>`;
  else if (s.pattern === 'spots')
    motif = [[14,19],[26,19],[20,27],[14,34],[26,34]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3" fill="${s.second}"/>`).join('');
  else if (s.pattern === 'halved')
    motif = `<rect x="20" y="12" width="12" height="28" fill="${s.second}"/>`;
  else if (s.pattern === 'star')
    motif = `<path d="M20 17 L22.4 23 L28.6 23 L23.6 27 L25.6 33 L20 29.4 L14.4 33 L16.4 27 L11.4 23 L17.6 23 Z" fill="${s.second}"/>`;

  return `<svg class="silks" viewBox="0 0 40 46" aria-hidden="true">
    <defs><clipPath id="${cid}"><path d="M13 12 L27 12 L32 15 L32 39 L8 39 L8 15 Z"/></clipPath></defs>
    <circle cx="20" cy="5.5" r="4.4" fill="${s.cap}" stroke="rgba(0,0,0,.25)"/>
    <rect x="2.5" y="15" width="6" height="20" rx="1.6" fill="${s.sleeves}" stroke="rgba(0,0,0,.25)" stroke-width=".7"/>
    <rect x="31.5" y="15" width="6" height="20" rx="1.6" fill="${s.sleeves}" stroke="rgba(0,0,0,.25)" stroke-width=".7"/>
    <g clip-path="url(#${cid})">
      <rect x="8" y="12" width="24" height="28" fill="${s.base}"/>
      ${motif}
    </g>
    <path d="M13 12 L27 12 L32 15 L32 39 L8 39 L8 15 Z" fill="none" stroke="rgba(0,0,0,.3)" stroke-width=".8"/>
  </svg>`;
}

/* ============================================================
   4. VIEW
   ============================================================ */
const state = { date:null, cards:[], raceId:null, opts:{...DEFAULTS} };

const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function tomorrowISO(){
  const d = new Date(); d.setDate(d.getDate()+1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function prettyDate(iso){
  return new Date(iso+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
}
function fmtDist(f){
  const m = Math.floor(f/8), rest = f - m*8;
  const half = rest % 1 >= 0.5 ? '½' : '';
  const whole = Math.floor(rest);
  const fp = whole || half ? `${whole||''}${half}f` : '';
  return [m ? `${m}m` : '', fp].filter(Boolean).join(' ') || `${f}f`;
}

function renderRail(){
  const rail = el('rail');
  if (!state.cards.length){ rail.innerHTML = ''; return; }
  rail.innerHTML = `<p class="rail-head">${state.cards.length} meeting${state.cards.length===1?'':'s'} · ${state.cards.reduce((n,m)=>n+m.races.length,0)} races</p>` +
    state.cards.map(m => `
      <div class="meeting">
        <div class="meeting-name">${esc(m.courseName || m.course)} <span class="meeting-going">${esc(m.going||'')}</span></div>
        ${m.races.map(r => `
          <button class="race-btn ${r.id===state.raceId?'is-on':''}" data-race="${esc(r.id)}">
            <span class="race-time">${esc(r.time)}</span>
            <span class="race-blurb">${fmtDist(r.dist)} · ${esc(r.name)}</span>
          </button>`).join('')}
      </div>`).join('');
}

function findRace(id){
  for (const m of state.cards) for (const r of m.races) if (r.id === id) return r;
  return null;
}

function renderRace(){
  const area = el('cardArea');
  const race = findRace(state.raceId);
  if (!race){
    area.innerHTML = `<div class="empty">
      <h2>Pick a race</h2>
      <p>Every runner is scored on its last ${state.opts.runs} outings — 5 points for a win, 4 for a second, down to 1 for a fifth — then given 2 more for a previous win at the course, 2 for a win over the trip, and 1 on top if a single win did both.</p>
      <p>Nothing here is a tip. It is one arithmetic opinion among many.</p>
    </div>`;
    return;
  }

  const ranked = rankRunners(race, state.opts);
  const cap = maxPossible(state.opts);

  area.innerHTML = `
    <div class="race-head">
      <h2 class="race-title">${esc(race.time)} ${esc(race.courseName || race.course)} — ${esc(race.name)}</h2>
      <div class="race-meta">
        <span class="tag tag-key">${fmtDist(race.dist)}${race.about?' (abt)':''}</span>
        <span class="tag">${esc(race.surface || race.going || 'Surface n/k')}</span>
        <span class="tag">${ranked.length} runners</span>
        <span class="tag">Max ${cap} pts</span>
      </div>
    </div>
    <ol class="runners">${ranked.map((r,i)=>runnerRow(r,i,cap)).join('')}</ol>
    <p class="footnote">
      Scored from the last ${state.opts.runs} runs, with course and distance wins taken from
      ${state.opts.scope === 'career' ? 'the whole career' : 'the counted runs only'}.
      A gold outline on a run means that win was over this course <em>and</em> this trip.
      Ties are shown jointly and broken on form points, then on the freshest win.
      ${DataSource.mode === 'sample' ? 'These are generated sample cards — the horses are not real.' : ''}
    </p>`;

  requestAnimationFrame(() => {
    document.querySelectorAll('.score-bar i').forEach(b => b.style.width = b.dataset.w + '%');
  });
}

function runnerRow(r, i, cap){
  const s = r.score;
  const rungs = s.rungs.map(g => {
    const label = typeof g.pos === 'number' ? (g.pos > 9 ? '9+' : g.pos) : g.pos;
    const posAttr = (typeof g.pos === 'number' && g.pos <= 5) ? g.pos : '';
    return `<span class="rung ${g.cd?'is-cd':''}" data-pos="${posAttr}"
      title="${esc(g.courseName || g.course)} ${fmtDist(g.dist)} · ${esc(g.date)} · finished ${label} · ${g.pts} pt${g.pts===1?'':'s'}">${label}</span>`;
  }).join('');

  const chip = (on, label, pts, unknown) =>
    `<span class="chip ${on?'':'is-off'}" ${unknown?'title="Won here and won over the trip, but the visible starts don\'t show one win that did both."':''}>${label} ${unknown?(on?'+'+pts+'?':'?'):(on?'+'+pts:'—')}</span>`;

  return `<li class="runner ${i===0?'is-top':''}">
    <div class="rank">${r.joint?'=':''}${r.rank}${i===0?'<small>top</small>':''}</div>
    ${silksSVG(r.silks || silksFromText(r.silksText, r.name), r.cloth + '-' + i)}
    <div class="runner-main">
      <div class="horse"><span class="cloth">${r.cloth}</span>${esc(r.name)}</div>
      <div class="people">${esc(r.jockey||'')}${r.trainer?' · '+esc(r.trainer):''}${r.age?' · '+r.age+'yo':''}${r.mlOdds&&+r.mlOdds?' · ML '+(+r.mlOdds)+'-1':''}</div>
      <div class="ladder">
        <span class="ladder-label">Form</span>${rungs}
        <span class="rung-sep"></span>
        ${chip(s.wonCourse,'Course',BONUS.course)}
        ${chip(s.wonDist,'Trip',BONUS.distance)}
        ${chip(s.wonCD,'C&amp;D',BONUS.courseAndDistance, s.cdUnknown)}
      </div>
    </div>
    <div class="score">
      <div class="score-num">${s.total}</div>
      <div class="score-word">${s.formPoints} form + ${s.bonus} bonus</div>
      <div class="score-bar"><i data-w="${Math.round(s.total/cap*100)}"></i></div>
    </div>
  </li>`;
}

/* ============================================================
   5. WIRING
   ============================================================ */
async function load(){
  el('dateNote').textContent = 'Loading cards…';
  try{
    state.cards = await DataSource.cardsFor(state.date);
    state.raceId = null;
    document.querySelectorAll('.banner').forEach(b => b.remove());
    el('dateNote').textContent = `Racing ${prettyDate(state.date)} · scored on last ${state.opts.runs} runs`;
  }catch(err){
    state.cards = [];
    el('dateNote').textContent = 'No cards loaded';
    const b = document.createElement('div');
    b.className = 'banner';
    b.textContent = `Couldn't load that card file. ${err.message} — put a JSON file at data/racecards-${state.date}.json, or switch back to sample cards.`;
    el('settings').after(b);
  }
  renderRail(); renderRace();
}

el('rail').addEventListener('click', e => {
  const btn = e.target.closest('[data-race]');
  if (!btn) return;
  state.raceId = btn.dataset.race;
  renderRail(); renderRace();
  if (window.innerWidth <= 820) el('cardArea').scrollIntoView({behavior:'smooth', block:'start'});
});

el('settingsBtn').addEventListener('click', () => {
  const open = el('settings').classList.toggle('is-open');
  el('settingsBtn').setAttribute('aria-expanded', open);
});

el('raceDate').addEventListener('change', e => { state.date = e.target.value; load(); });
el('optRuns').addEventListener('change', e => { state.opts.runs = +e.target.value; el('dateNote').textContent = `Racing ${prettyDate(state.date)} · scored on last ${state.opts.runs} runs`; renderRace(); });
el('optScope').addEventListener('change', e => { state.opts.scope = e.target.value; renderRace(); });
el('optTol').addEventListener('change', e => { state.opts.tol = +e.target.value; renderRace(); });
el('optCD').addEventListener('change', e => { state.opts.unknownCD = e.target.value; renderRace(); });
el('optSource').addEventListener('change', e => { DataSource.mode = e.target.value; load(); });

const built = embedded();
state.date = built ? built.date : tomorrowISO();
el('optSource').value = DataSource.mode;
el('raceDate').value = state.date;
load();
</script>
</body>
</html>

name: BaT California Scan

on:
  schedule:
    # Runs every 6 hours. Adjust the cron expression to change frequency.
    # Format: minute hour day month day-of-week (all times UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bat
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python bat_ca_scanner.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.md results.json
          git diff --quiet --cached || git commit -m "Update BaT CA scan results"
          git push
